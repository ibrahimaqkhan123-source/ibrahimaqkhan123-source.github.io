<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ibra | Developer Portfolio</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background-color: var(--card);
      border-radius: 16px;
      padding: 40px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.1);
      text-align: center;
    }
    h1 {
      font-size: 2.5rem;
      color: var(--accent);
      margin-bottom: 10px;
    }
    p.subtitle {
      color: var(--subtext);
      font-size: 1.1rem;
      margin-bottom: 25px;
    }
    .bio {
      font-size: 1rem;
      line-height: 1.6;
      color: #cbd5e1;
      margin-bottom: 30px;
    }
    .skills {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }
    .tag {
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.875rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Ibra</h1>
    <p class="subtitle">Scratcher & Developer</p>
    <p class="bio">
      Welcome to my website! I create projects using Scratch, web tools, and open-source software.
    </p>
    <div class="skills">
      <span class="tag">Scratch</span>
      <span class="tag">HTML/CSS</span>
      <span class="tag">Linux</span>
    </div>
  </div>
</body>
</html>
